// Hellmacs test fixture: a small Gradle project exercising Lombok and JUnit.
plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

application {
    mainClass = 'dev.hellmacs.demo.App'
}

test {
    useJUnitPlatform()
    // BrokenTest only runs (and fails) with -Dhellmacs.fail=true.
    systemProperty 'hellmacs.fail', System.getProperty('hellmacs.fail', 'false')
}
